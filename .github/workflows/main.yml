name: Deploy Backend to VPS

on:
  push:
    branches: [etu]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-quadrivago
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Prepare deployment
        run: |
          mkdir publish
          cp -r dist publish/
          cp package.json package-lock.json publish/

      - name: Create environment file
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          umask 077
          printf '%s\n' "$ENV_PRODUCTION" > publish/.env

      - name: Upload to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "publish/dist,publish/package.json,publish/package-lock.json,publish/.env"
          target: "/var/www/quadrivago/releases/${{ github.sha }}"
          strip_components: 1

      - name: Start backend
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_ID: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: RELEASE_ID
          script: |
            set -eu

            cd "/var/www/quadrivago/releases/$RELEASE_ID"
            chmod 600 .env
            npm ci --omit=dev

            ln -sfn "/var/www/quadrivago/releases/$RELEASE_ID" \
              /var/www/quadrivago/current

            sudo -n systemctl restart quadrivago

            for attempt in $(seq 1 15); do
              if curl --fail --silent http://127.0.0.1:3001/ping; then
                echo "API is running"
                exit 0
              fi
              sleep 2
            done

            sudo -n systemctl status quadrivago --no-pager
            exit 1
